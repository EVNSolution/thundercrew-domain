name: AWS EC2 authorize SSH key

# 호스트의 `~/.ssh/authorized_keys` 에 공개키를 추가한다.
#
# 왜 필요한가: 개인키 로컬 사본을 잃으면 SSH 로 들어갈 수 없다. 그런데 배포 워크플로가
# 쓰는 `AWS_EC2_SSH_PRIVATE_KEY` 시크릿에는 **작동하는 키가 남아 있다.** 그 경로로 새
# 공개키를 등록하면 콘솔 수술이나 다운타임 없이 접속을 되찾을 수 있다.
#
# 공개키만 입력으로 받는다. 개인키는 어디에도 오가지 않는다 — 시크릿에서 개인키를 꺼내
# 로그로 출력하는 방식은 쓰지 않는다. 그러면 저장소 읽기 권한이 있는 모두가 볼 수 있는
# 곳에 키가 남아, "로컬 사본 분실" 이 "키 유출" 로 바뀐다.
#
# 되돌리기: `remove` 모드로 같은 공개키를 넘기면 지운다.

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: '공개키 한 줄 (ssh-ed25519 ... 또는 ssh-rsa ...). 개인키를 넣지 마세요.'
        required: true
        type: string
      mode:
        description: 'add = 추가, remove = 제거'
        required: true
        default: 'add'
        type: choice
        options:
          - add
          - remove

permissions:
  contents: read

concurrency:
  group: aws-ec2-authorize-ssh-key
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize SSH public key on host
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 10
    env:
      AWS_EC2_HOST: ${{ vars.AWS_EC2_HOST }}
      AWS_EC2_USER: ${{ vars.AWS_EC2_USER || 'ubuntu' }}
    steps:
      # 개인키가 잘못 붙여넣어진 경우를 먼저 막는다. 그대로 진행하면 그 값이 Actions
      # 로그와 워크플로 실행 기록에 남는다.
      - name: Reject anything that is not a public key
        env:
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          if printf '%s' "${PUBLIC_KEY}" | grep -qi 'PRIVATE KEY'; then
            echo "::error title=Private key submitted::개인키를 넣으셨습니다. 이 실행 기록을 삭제하고 그 키를 폐기하세요. 공개키(.pub, 한 줄)만 넣어야 합니다."
            exit 1
          fi
          case "${PUBLIC_KEY}" in
            ssh-ed25519\ *|ssh-rsa\ *|ecdsa-sha2-*\ *) ;;
            *)
              echo "::error title=Not a public key::`ssh-ed25519`, `ssh-rsa`, `ecdsa-sha2-*` 로 시작하는 한 줄이어야 합니다."
              exit 1
              ;;
          esac
          # 줄이 여러 개면 authorized_keys 를 의도치 않게 여러 줄 바꾼다.
          if [ "$(printf '%s' "${PUBLIC_KEY}" | wc -l)" -gt 0 ]; then
            echo "::error title=Multi-line input::한 줄만 넣어야 합니다."
            exit 1
          fi
          echo "형식 확인 통과."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          AWS_EC2_SSH_PRIVATE_KEY: ${{ secrets.AWS_EC2_SSH_PRIVATE_KEY }}
          AWS_EC2_KNOWN_HOSTS: ${{ secrets.AWS_EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${AWS_EC2_SSH_PRIVATE_KEY}" > ~/.ssh/thundercrew_ec2_key
          chmod 600 ~/.ssh/thundercrew_ec2_key
          printf '%s\n' "${AWS_EC2_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      - name: Apply
        env:
          PUBLIC_KEY: ${{ inputs.public_key }}
          MODE: ${{ inputs.mode }}
        run: |
          ssh -i ~/.ssh/thundercrew_ec2_key "${AWS_EC2_USER}@${AWS_EC2_HOST}" \
            "PUBLIC_KEY='${PUBLIC_KEY}' MODE='${MODE}' bash -s" <<'REMOTE'
          set -euo pipefail

          AUTH="${HOME}/.ssh/authorized_keys"
          install -m 700 -d "${HOME}/.ssh"
          touch "${AUTH}"
          chmod 600 "${AUTH}"

          # 되돌릴 수 있게 백업을 남긴다. 이 파일이 깨지면 접속을 잃는다.
          backup="${AUTH}.bak.$(date -u +%Y%m%dT%H%M%SZ)"
          cp "${AUTH}" "${backup}"
          echo "백업: ${backup}"

          before="$(wc -l < "${AUTH}")"

          case "${MODE}" in
            add)
              if grep -qxF "${PUBLIC_KEY}" "${AUTH}"; then
                echo "이미 등록된 공개키입니다. 변경 없음."
              else
                printf '%s\n' "${PUBLIC_KEY}" >> "${AUTH}"
                echo "추가했습니다."
              fi
              ;;
            remove)
              # 마지막 키를 지워 스스로 잠기는 것을 막는다.
              remaining="$(grep -vxF "${PUBLIC_KEY}" "${AUTH}" | grep -c '^ssh-\|^ecdsa-' || true)"
              if [ "${remaining}" -lt 1 ]; then
                echo "::error title=Would lock you out::이 키를 지우면 남는 공개키가 없습니다. 중단합니다."
                exit 1
              fi
              grep -vxF "${PUBLIC_KEY}" "${backup}" > "${AUTH}"
              echo "제거했습니다."
              ;;
          esac

          after="$(wc -l < "${AUTH}")"
          echo "authorized_keys 줄 수: ${before} -> ${after}"

          # 지문만 출력한다. 공개키 전문은 로그를 길게 만들 뿐이고, 지문으로 대조가 된다.
          echo "── 현재 등록된 키 지문"
          ssh-keygen -lf "${AUTH}" || true
          REMOTE

      - name: Summary
        if: always()
        run: |
          {
            echo "## SSH 공개키 ${{ inputs.mode }}"
            echo "- 호스트: \`${AWS_EC2_USER}@${AWS_EC2_HOST}\`"
            echo "- 다음 단계: 새 개인키로 접속을 확인하세요."
            echo '  ```'
            echo "  ssh -i <새 개인키> ${AWS_EC2_USER}@${AWS_EC2_HOST} 'echo OK; whoami'"
            echo '  ```'
            echo "- 확인되면 \`AWS_EC2_SSH_PRIVATE_KEY\` 시크릿도 새 키로 교체하는 것을 권합니다."
          } >> "$GITHUB_STEP_SUMMARY"
