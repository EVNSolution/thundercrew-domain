name: PR checks

# PR 검증. 배포와 완전히 분리된 경로다 — 아무것도 배포하지 않고 호스트에 접속하지
# 않는다. AWS 자격증명도 쓰지 않는다.
#
# 이걸 만든 이유: 스키마 마이그레이션이 처음 실행되는 곳이 운영 DB 였다. 배포
# 워크플로가 `bootJar -x test` 로 테스트를 건너뛰고 PR 을 검증하는 워크플로가 아예
# 없었다. Testcontainers 는 Docker 를 요구하고 개발자 PC 에 Docker 가 없을 수 있으므로,
# GitHub 러너(Docker 내장)에서 도는 것이 마이그레이션을 실제로 실행해 보는 유일한
# 자동 경로다.

on:
  pull_request:
    branches: [dev, main]
  # dev 에 직접 push 되는 경우도 검증한다. dev 에 브랜치 보호가 없어서 PR 을
  # 우회한 머지가 가능하다.
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 — 마이그레이션·통합 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Testcontainers 가 실제 Postgres 를 띄우고 Flyway 가 V1 부터 순서대로 돌린다.
      # 그래서 이 잡이 초록이면 마이그레이션이 빈 DB 에서 적용 가능하다는 뜻이다.
      # 운영 데이터에 대한 백필 결과는 여기서 검증되지 않는다 — 그건 운영 스냅샷이
      # 필요하다.
      - name: 테스트
        working-directory: development/backend
        run: ./gradlew --no-daemon test -PskipArchitectureTests

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            development/backend/build/reports/tests/test
            development/backend/build/test-results/test
          retention-days: 7
          if-no-files-found: ignore

  backend-architecture:
    name: 백엔드 — 아키텍처 규칙 (비차단)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR 을 막지 않는다. ArchitectureBoundaryTests 의 allowlist 가 낡아서 dev
    # 기준선에서도 20건이 위반으로 잡힌다 — 전부 나중에 추가된 커맨드 컨트롤러
    # 메서드이고, 규칙을 어긴 새 코드가 아니다. 차단 조건으로 두면 CI 가 처음부터
    # 빨개져서 아무도 보지 않게 된다.
    #
    # 그렇다고 지우지도 않는다. 위반 목록이 계속 보여야 정리할 수 있고, 새로 늘어난
    # 것도 여기서 눈에 띈다. allowlist 를 정리하면 이 잡을 차단으로 올리고 backend
    # 잡의 `-PskipArchitectureTests` 를 없애면 된다.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 아키텍처 규칙 검사
        working-directory: development/backend
        run: ./gradlew --no-daemon test --tests "*ArchitectureBoundaryTests*"

  frontend:
    name: 운영 콘솔 — 타입·린트·테스트·빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 워크스페이스 배치 점검
        run: npm run check:workspace

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:service-ops

      # 빌드가 통과해야 배포가 통과한다. 배포 워크플로와 같은 명령을 쓴다.
      # NEXT_PUBLIC_* 값이 없으면 지도 관련 코드가 빈 키로 빌드되지만, 빌드 자체는
      # 통과한다 — 여기서 보는 것은 타입·번들 오류다.
      - name: 빌드
        run: npm run build

  web:
    name: 새 관리자 웹 — 타입·린트·빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `development/web` 은 SPA 슬라이스 브랜치에만 있다. dev 에 아직 없으므로
      # 없으면 조용히 넘어간다 — 슬라이스가 머지되면 이 잡이 그때부터 일한다.
      # 워크플로를 나중에 고치지 않아도 되게 이렇게 둔다.
      - name: 존재 확인
        id: probe
        run: |
          if [ -d development/web ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "development/web 이 이 ref 에 없습니다. 건너뜁니다."
          fi

      - uses: actions/setup-node@v4
        if: steps.probe.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        if: steps.probe.outputs.present == 'true'

      - run: npm run typecheck:web
        if: steps.probe.outputs.present == 'true'

      - run: npm run lint --workspace @thundercrew/web
        if: steps.probe.outputs.present == 'true'

      # mock 으로 빌드한다. remote 는 백엔드 주소를 요구하고 CI 에는 백엔드가 없다.
      - run: npm run build:mock --workspace @thundercrew/web
        if: steps.probe.outputs.present == 'true'
