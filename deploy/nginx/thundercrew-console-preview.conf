# 운영 콘솔 프리뷰 (8090).
#
# 운영 콘솔과 **같은 Next.js 코드**를 별도 프로세스로 띄워, 머지 전에 변경을 눌러볼 수
# 있게 한다. 프리뷰 프로세스는 프리뷰 백엔드를 보고, 그 백엔드는 프리뷰 DB 를 본다 —
# QA 에서 만든 차량·주문·계약이 운영 데이터에 남지 않는다.
#
# 이 블록이 예전 `thundercrew-web-preview.conf`(Vite SPA 정적 서빙)를 대체한다.
#
# `/api/` 를 프록시하지 않는다. 예전 블록이 그걸 했다가 인증 없는 텔레메트리 주입 경로를
# 열었다 — `POST /api/v1/telemetry/device-events` 는 permitAll 이고, 공개 콜백을 Next.js 가
# 채널토큰으로 검증하고 localhost 로만 부른다는 전제이기 때문이다. Next.js 프로세스가
# 서버 사이드에서 백엔드를 호출하므로 브라우저가 `/api` 에 직접 닿을 필요가 없다.
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    access_log /var/log/nginx/thundercrew-console-preview.access.log;
    error_log /var/log/nginx/thundercrew-console-preview.error.log;

    # 검색엔진과 링크 미리보기가 프리뷰를 긁어가지 않게 한다.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 운영과 혼동하지 않게 표시를 남긴다. 화면이 같으므로 주소만으로는 구분이 어렵다.
    add_header X-Thundercrew-Environment "preview" always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
