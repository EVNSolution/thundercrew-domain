# 새 관리자 웹(Vite SPA) QA 프리뷰용 nginx server block.
#
# 기존 운영 콘솔(Next.js, 127.0.0.1:3000)과 병행한다. 운영 server block 은
# 건드리지 않는다. 포트만 다르고 같은 호스트·같은 DB·같은 백엔드를 본다.
#
# 사용 중인 포트: 3000(Next.js) 8080(service-ops-api) 80/443(nginx) 5432(PostgreSQL)
# 프리뷰: 8090
#
# 릴리스 경로는 DSV(`clever-dsv-web`) 규약을 따른다.
#   /srv/thundercrew-web/releases/<release-id>   릴리스 디렉터리
#   /srv/thundercrew-web/current                 현재 릴리스 심링크

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    # 심링크를 따라간 실제 경로를 매 요청마다 다시 확인한다.
    # 이 값이 on 이면 릴리스를 바꿔도 nginx 가 옛 inode 를 붙들지 않는다.
    disable_symlinks off;

    root /srv/thundercrew-web/current;
    index index.html;

    access_log /var/log/nginx/thundercrew-web-preview.access.log;
    error_log  /var/log/nginx/thundercrew-web-preview.error.log;

    # 해시가 붙은 자산은 영구 캐시. 파일이 없으면 index.html 로 흘리지 않고 404 를 준다
    # (없는 자산을 HTML 로 돌려주면 디버깅이 어려워진다).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 은 캐시하지 않는다. 릴리스를 바꿨는데 옛 번들을 가리키면 안 된다.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # service-ops-api 프록시는 **두지 않는다.**
    #
    # 원래 remote 모드 QA 를 위해 `/api/` 를 127.0.0.1:8080 으로 프록시했는데,
    # 그것이 인증 없이 텔레메트리를 주입할 수 있는 구멍을 열었다.
    # `POST /api/v1/telemetry/device-events` 는 SecurityConfig 에서 permitAll 이다 —
    # 공개 콜백을 Next.js 가 채널토큰으로 검증하고 **localhost 로만** 이 엔드포인트를
    # 부른다는 전제이기 때문이다(docs/superpowers/plans/2026-06-23-otoplug-device-integration.md).
    # 운영 nginx 는 `/api/v1/**` 를 백엔드로 넘기지 않아서 그 전제가 지켜지는데,
    # 이 프리뷰 block 이 넘기면 전제가 깨지고 누구든 가짜 위치·주행거리·시동 상태를
    # 운영 DB 에 밀어넣을 수 있다. 보안 그룹이 IP 를 제한하고 있어도 설정으로 남겨둘
    # 이유가 없다.
    #
    # remote 모드는 현재 workflow 가 거부한다(평문 HTTP + Secure 쿠키). 그러므로
    # 지금 이 프록시는 쓰이지 않는다. remote QA 를 열 때 다시 넣되, 그때는
    # ingest 경로를 명시적으로 막고(`location = /api/v1/telemetry/device-events
    # { deny all; }`) TLS 를 붙여야 한다.

    # SPA fallback. 위 location 에 걸리지 않은 모든 경로는 index.html 이 받는다.
    # /delivery/control 같은 클라이언트 라우트가 직접 열려도 동작해야 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
