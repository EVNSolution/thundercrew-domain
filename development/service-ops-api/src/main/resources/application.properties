spring.application.name=service-ops-api

spring.datasource.url=${SERVICE_OPS_DB_URL:jdbc:postgresql://localhost:5432/service_ops_api}
spring.datasource.username=${SERVICE_OPS_DB_USERNAME:service_ops}
spring.datasource.password=${SERVICE_OPS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Admin JWT auth. Provide the secret through environment variables or local .env only.
thundercrew.auth.jwt.secret=${THUNDERCREW_AUTH_JWT_SECRET:}
thundercrew.auth.jwt.issuer=${THUNDERCREW_AUTH_JWT_ISSUER:thundercrew-domain}
thundercrew.auth.jwt.access-token-ttl=${THUNDERCREW_AUTH_JWT_ACCESS_TOKEN_TTL:PT30M}
thundercrew.auth.refresh-token-ttl=${THUNDERCREW_AUTH_REFRESH_TOKEN_TTL:P14D}
